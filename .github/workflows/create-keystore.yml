name: Create StreamGit101 Test Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Test Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore streamgit101-test.jks \
            -storetype JKS \
            -alias streamgit101 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass streamgit101test \
            -keypass streamgit101test \
            -dname "CN=streamgit101, OU=Test, O=streamgit101, L=Cairo, ST=Cairo, C=EG"

      - name: Show SHA-1
        run: |
          keytool -list -v \
            -keystore streamgit101-test.jks \
            -alias streamgit101 \
            -storepass streamgit101test \
            | grep -E "SHA1:|SHA-1:"

      - name: Encode Keystore
        run: |
          base64 -w 0 streamgit101-test.jks > streamgit101-test.jks.base64

          echo "========================================"
          echo "KEYSTORE BASE64"
          echo "========================================"

          cat streamgit101-test.jks.base64

      - name: Upload Test Keystore
        uses: actions/upload-artifact@v4
        with:
          name: streamgit101-test-keystore
          path: streamgit101-test.jks
